[project]
name = "voice-translator"
version = "1.3.1"
description = "Local-first AI audio/video transcription and translation desktop app"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6==6.7.2",
    "PySide6-Fluent-Widgets>=1.6.0",
    "openai>=1.40.0",
    "pysubs2>=1.7.3",
    "requests>=2.32.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "onnxruntime-directml>=1.18.0; platform_system == 'Windows'",
    "onnxruntime>=1.18.0; platform_system != 'Windows'",
    "soundfile>=0.12.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
